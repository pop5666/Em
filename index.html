<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Fish Clan Battle - Leaderboard Edition</title>
<style>
:root{--ink:#ffffff;--gold:#ffd700}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#021226;overflow:hidden;touch-action:none;font-family:"Comic Sans MS","Chalkboard SE","Sarabun",sans-serif;user-select:none;-webkit-user-select:none}
canvas{display:block;width:100%;height:100%}
.modal{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:15px;color:var(--ink);text-align:center;background:rgba(5,25,50,.92);padding:20px;z-index:10}
.modal.hide{display:none}
h1{margin:0;font-size:clamp(26px,5vw,42px);color:var(--gold);text-shadow:0 4px 0 #ff6b6b,0 8px 15px rgba(0,0,0,0.4)}
p{margin:0;max-width:500px;line-height:1.5;font-size:15px}
.btn-group{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;margin-top:10px}
button{font:inherit;font-size:16px;font-weight:bold;color:#fff;background:linear-gradient(135deg,#ff7675,#d63031);border:3px solid #fff;border-radius:30px;padding:10px 24px;cursor:pointer;box-shadow:0 5px 15px rgba(0,0,0,0.3);transition:transform .1s}
button:active{transform:scale(.95)}
button.sec{background:linear-gradient(135deg,#0984e3,#74b9ff)}

.shop-grid{display:flex;gap:15px;justify-content:center;align-items:center;margin:15px 0}
.shop-card{background:rgba(255,255,255,0.1);border:2px solid rgba(255,255,255,0.3);border-radius:15px;padding:15px;width:110px;display:flex;flex-direction:column;align-items:center;cursor:pointer;transition:all 0.2s}
.shop-card.selected{border-color:var(--gold);background:rgba(255,215,0,0.2);transform:scale(1.05)}
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="menuModal" class="modal">
  <h1>🌊 Fish Clan Battle 🌊</h1>
  <p>ว่ายดูดฝูงปลาเข้าเขตวงกลม ยิงเส้นวงกลมชนตัวอ่อนแอกว่าจะดูดลูกปลาเข้ามาได้!</p>
  <div class="shop-grid" id="shopGrid"></div>
  <div class="btn-group">
    <button onclick="initAudio(); startGame()">เริ่มเล่นเลย!</button>
  </div>
</div>

<div id="resultModal" class="modal hide">
  <h1 id="resultTitle">🎉 ชนะแล้ว! 🎉</h1>
  <p id="resultDesc">คุณคือเจ้าแห่งทะเล!</p>
  <div class="btn-group">
    <button onclick="startGame()">เริ่มเล่นใหม่</button>
    <button class="sec" onclick="showShopModal()">เปลี่ยนตัวละคร</button>
  </div>
</div>

<script>
const $=id=>document.getElementById(id), cv=$('c'), ctx=cv.getContext('2d');
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));

const AudioCtx = window.AudioContext || window.webkitAudioContext;
let audioCtx = null;
function initAudio(){ if(!audioCtx) audioCtx = new AudioCtx(); }

function playPopSound(){
  if(!audioCtx) return;
  const osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
  osc.type = 'sine';
  osc.frequency.setValueAtTime(150, audioCtx.currentTime);
  osc.frequency.exponentialRampToValueAtTime(600, audioCtx.currentTime + 0.06);
  gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.06);
  osc.connect(gain); gain.connect(audioCtx.destination);
  osc.start(); osc.stop(audioCtx.currentTime + 0.06);
}

function playCheerSound(){
  if(!audioCtx) return;
  const now = audioCtx.currentTime;
  [400, 550, 700, 880, 1100].forEach((f, i) => {
    const osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
    osc.type = 'triangle'; osc.frequency.value = f;
    gain.gain.setValueAtTime(0.2, now + i*0.05);
    gain.gain.exponentialRampToValueAtTime(0.01, now + i*0.05 + 0.2);
    osc.connect(gain); gain.connect(audioCtx.destination);
    osc.start(now + i*0.05); osc.stop(now + i*0.05 + 0.2);
  });
}

const CHARACTERS = [
  { id: 'orange', name: 'ส้มจี๊ด', hue: 20 },
  { id: 'nemo', name: 'นีโม', hue: 35 },
  { id: 'shark', name: 'ฉลามจิ๋ว', hue: 200 },
  { id: 'neon', name: 'นีออน', hue: 280 }
];
let selectedChar = CHARACTERS[0];

function renderShop(){
  const grid = $('shopGrid');
  grid.innerHTML = '';
  CHARACTERS.forEach(c => {
    const card = document.createElement('div');
    card.className = 'shop-card' + (c.id === selectedChar.id ? ' selected' : '');
    card.onclick = () => { selectedChar = c; renderShop(); };
    card.innerHTML = `
      <canvas id="preview_${c.id}" width="60" height="40"></canvas>
      <div style="font-size:13px;font-weight:bold;margin-top:5px">${c.name}</div>
    `;
    grid.appendChild(card);
    setTimeout(() => drawPreviewFish(`preview_${c.id}`, c.hue), 10);
  });
}

function drawPreviewFish(canvasId, hue){
  const c = $(canvasId); if(!c) return;
  const cx = c.getContext('2d');
  cx.clearRect(0,0,60,40);
  drawFishShape(cx, 30, 20, 16, 1, hue);
}

// ระบบคำนวณเลเวลแบบช้าลง (ต้องสะสมปลามากขึ้นเรื่อยๆ)
function calcLevel(minionCount){
  return 1 + Math.floor(Math.sqrt(minionCount / 2));
}

const WORLD = { w: 3500, h: 2000, surfaceY: 150 }; 
let W, H, camera = { x: 0, y: 0 };
let confetti = [], freeMinions = [];

function generateWorld(){
  freeMinions = [];
  for(let i=0; i<45; i++){
    freeMinions.push({
      x: Math.random()*WORLD.w,
      y: WORLD.surfaceY + 80 + Math.random()*(WORLD.h - WORLD.surfaceY - 160),
      r: 16, hue: Math.random()*360
    });
  }
}

function resize(){
  const d=devicePixelRatio||1; W=innerWidth; H=innerHeight;
  cv.width=W*d; cv.height=H*d; ctx.setTransform(d,0,0,d,0,0);
}
addEventListener('resize',resize); resize(); renderShop();

const S = { mode:'menu', kills:0, t:0, fish:[] };

const P = {
  isPlayer: true, name: 'คุณ',
  x: WORLD.w/2, y: WORLD.h/2, vx:0, vy:0, dir:1, r:20,
  minions: 2, level: 1, auraR: 60
};

function startGame(){
  Object.assign(S, { mode:'play', kills:0, fish:[] });
  P.x = WORLD.w/2; P.y = WORLD.h/2; P.vx = P.vy = 0;
  P.minions = 2; P.level = 1;
  generateWorld();

  // สร้าง AI ทั่วไป
  for(let i=0; i<7; i++){
    spawnAI(Math.floor(1 + Math.random() * 5), 'AI ' + (i+1));
  }
  // สร้าง AI ตัวโหด (ลูกปลาเยอะกว่าเรา)
  spawnAI(15, 'บอสใหญ่ 👑');
  spawnAI(25, 'จอมโหด ⚡');

  $('menuModal').className = 'modal hide';$('resultModal').className = 'modal hide';
}

function showShopModal(){
  $('resultModal').className = 'modal hide';$('menuModal').className = 'modal';
  renderShop();
}

function spawnAI(startMinions, name){
  S.fish.push({
    isPlayer: false, name: name || 'AI',
    x: Math.random() * WORLD.w,
    y: WORLD.surfaceY + 100 + Math.random() * (WORLD.h - WORLD.surfaceY - 200),
    r: 20, vx: 0, vy: 0, dir: 1,
    minions: startMinions, level: 1, auraR: 60,
    hue: Math.random()*360, changeTimer: 0
  });
}

function triggerWin(){
  S.mode = 'win';
  playCheerSound();
  confetti = [];
  for(let i=0; i<80; i++){
    confetti.push({ x: W/2, y: H/2, vx: (Math.random()-.5)*400, vy: (Math.random()-.5)*400, color: `hsl(${Math.random()*360},100%,50%)` });
  }
  $('resultTitle').innerText = "🎉 ชนะแล้ว! คุณคืออันดับ 1 🎉";
  $('resultDesc').innerText = `คุณกำจัดปลาตัวอื่นไปได้ทั้งหมด ${S.kills} ตัว!`;
  $('resultModal').className = 'modal';
}

function triggerGameOver(){
  S.mode = 'fail';
  $('resultTitle').innerText = "💀 โดนดูดจนตุย! 💀";
  $('resultDesc').innerText = `สถิติกำจัด AI: ${S.kills} ตัว`;
  $('resultModal').className = 'modal';
}

function update(dt){
  S.t += dt;
  if(S.mode === 'win'){
    for(const c of confetti){ c.x += c.vx*dt; c.y += c.vy*dt; }
    return;
  }
  if(S.mode !== 'play') return;

  // เลเวลอัปช้าลง และเพิ่มขนาดวงอิทธิพลตามลูกปลา
  P.level = calcLevel(P.minions);
  P.auraR = 55 + Math.min(180, P.minions * 3.5);

  const speed = 120;
  P.vx += (joystickDir.x * speed - P.vx) * Math.min(1, dt * 8);
  P.vy += (joystickDir.y * speed - P.vy) * Math.min(1, dt * 8);
  
  P.x = clamp(P.x + P.vx * dt, P.r, WORLD.w - P.r);
  P.y = clamp(P.y + P.vy * dt, WORLD.surfaceY + P.r, WORLD.h - P.r);
  if(Math.abs(P.vx) > .1) P.dir = P.vx > 0 ? 1 : -1;

  camera.x += (P.x - W/2 - camera.x) * dt * 4;
  camera.y += (P.y - H/2 - camera.y) * dt * 4;

  // กินปลาอิสระ
  for(let i = freeMinions.length - 1; i >= 0; i--){
    const fm = freeMinions[i];
    if(Math.hypot(P.x - fm.x, P.y - fm.y) < P.auraR){
      P.minions += 0.8; playPopSound();
      freeMinions.splice(i, 1);
      spawnFreeMinion();
    }
  }

  // อัปเดต AI
  for(let i = S.fish.length - 1; i >= 0; i--){
    const f = S.fish[i];
    f.level = calcLevel(f.minions);
    f.auraR = 55 + Math.min(180, f.minions * 3.5);

    f.changeTimer -= dt;
    if(f.changeTimer <= 0){
      f.changeTimer = 1.5 + Math.random()*2;
      const angle = Math.random()*Math.PI*2;
      f.vx = Math.cos(angle) * speed;
      f.vy = Math.sin(angle) * speed;
    }

    f.x = clamp(f.x + f.vx * dt, f.r, WORLD.w - f.r);
    f.y = clamp(f.y + f.vy * dt, WORLD.surfaceY + f.r, WORLD.h - f.r);
    if(Math.abs(f.vx) > .1) f.dir = f.vx > 0 ? 1 : -1;

    // ระบบดูดลูกปลา: เมื่อเส้นวงกลมโดนกัน (Aura Touch Absorption)
    const distToP = Math.hypot(P.x - f.x, P.y - f.y);
    if(distToP < P.auraR + f.auraR){
      if(P.level > f.level || (P.level === f.level && P.minions > f.minions)){
        // วงเราโดนวง AI ที่อ่อนแอกว่า -> ดูดลูกปลาทันที
        if(f.minions > 0){
          f.minions = Math.max(0, f.minions - dt * 4);
          P.minions += dt * 4;
          playPopSound();
        } else {
          // ถ้าลูกมันหมด ตุยทันที
          S.kills++; playPopSound();
          S.fish.splice(i, 1);
          if(S.fish.length === 0) triggerWin();
        }
      } else if(f.level > P.level || (f.level === P.level && f.minions > P.minions)){
        // วง AI ที่โหดกว่าโดนเรา -> เราโดนดูดลูกปลา
        if(P.minions > 0){
          P.minions = Math.max(0, P.minions - dt * 4);
          f.minions += dt * 4;
        } else {
          triggerGameOver(); return;
        }
      }
    }
  }
}

function spawnFreeMinion(){
  freeMinions.push({
    x: Math.random()*WORLD.w, y: WORLD.surfaceY + 80 + Math.random()*(WORLD.h - WORLD.surfaceY - 160),
    r: 16, hue: Math.random()*360
  });
}

function drawFishShape(c, x, y, r, dir, hue){
  c.save();
  c.translate(x, y);
  c.scale(dir, 1);

  c.fillStyle = `hsl(${hue}, 85%, 55%)`;
  c.beginPath(); c.ellipse(0, 0, r, r*0.6, 0, 0, Math.PI*2); c.fill();

  c.beginPath(); c.moveTo(-r*0.8, 0);
  c.lineTo(-r*1.3, -r*0.4); c.lineTo(-r*1.3, r*0.4); c.closePath(); c.fill();

  c.fillStyle = '#fff'; c.beginPath(); c.arc(r*0.4, -r*0.15, 4, 0, Math.PI*2); c.fill();
  c.fillStyle = '#000'; c.beginPath(); c.arc(r*0.45, -r*0.15, 2, 0, Math.PI*2); c.fill();
  c.restore();
}

function drawFishGroup(x, y, auraR, count, dir, hue, isPlayer, name, level){
  // วาดเส้นวงกลมขอบเขต
  ctx.save();
  ctx.translate(x - camera.x, y - camera.y);
  ctx.strokeStyle = isPlayer ? 'rgba(255, 215, 0, 0.85)' : `hsla(${hue}, 80%, 60%, 0.65)`;
  ctx.lineWidth = 2.5; ctx.setLineDash([8, 6]);
  ctx.beginPath(); ctx.arc(0, 0, auraR, 0, Math.PI*2); ctx.stroke();
  ctx.restore();

  // วาดลูกปลาแบบ "อยู่เฉยๆ ลอยนิ่งๆ ในวง" ไม่หมุนวน
  const intCount = Math.floor(count);
  for(let i=0; i<intCount; i++){
    // กระจายตำแหน่งประจำตัวแบบคงที่
    const angle = (i * (Math.PI * 2 / Math.max(1, intCount)));
    const dist = (auraR * 0.5);
    const mx = x + Math.cos(angle) * dist;
    const my = y + Math.sin(angle) * dist;
    drawFishShape(ctx, mx - camera.x, my - camera.y, 15, dir, hue);
  }

  // วาดตัวปลาหลัก
  drawFishShape(ctx, x - camera.x, y - camera.y, 20, dir, hue);

  // ป้ายชื่อและเลเวล
  ctx.save();
  ctx.translate(x - camera.x, y - camera.y - 28);
  ctx.font = 'bold 12px sans-serif'; ctx.textAlign = 'center';
  ctx.fillStyle = isPlayer ? '#ffd700' : '#ffffff';
  ctx.fillText(`${name} (Lv.${level})`, 0, 0);
  ctx.restore();
}

function drawLeaderboard(){
  // รวมผู้เล่นและ AI ทั้งหมดมาจัดอันดับ
  const allFish = [P, ...S.fish];
  allFish.sort((a, b) => b.minions - a.minions);

  const playerRank = allFish.findIndex(f => f.isPlayer) + 1;

  ctx.save();
  ctx.fillStyle = 'rgba(0, 0, 0, 0.4)';
  ctx.fillRect(W - 180, 15, 160, 30 + Math.min(5, allFish.length) * 20);

  ctx.font = 'bold 13px sans-serif'; ctx.textAlign = 'left';
  ctx.fillStyle = '#ffd700';
  ctx.fillText(`🏆 อันดับของคุณ: #${playerRank}`, W - 170, 32);

  ctx.font = '12px sans-serif';
  for(let i=0; i<Math.min(5, allFish.length); i++){
    const f = allFish[i];
    ctx.fillStyle = f.isPlayer ? '#ffd700' : '#ffffff';
    ctx.fillText(`${i+1}. ${f.name}: ${Math.floor(f.minions)} ตัว`, W - 170, 52 + i*18);
  }
  ctx.restore();
}

function draw(){
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, '#74b9ff'); g.addColorStop(1, '#0984e3');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);

  if(S.mode==='menu') return;

  for(const fm of freeMinions){
    drawFishShape(ctx, fm.x - camera.x, fm.y - camera.y, fm.r, 1, fm.hue);
  }

  for(const f of S.fish){
    drawFishGroup(f.x, f.y, f.auraR, f.minions, f.dir, f.hue, false, f.name, f.level);
  }

  drawFishGroup(P.x, P.y, P.auraR, P.minions, P.dir, selectedChar.hue, true, P.name, P.level);

  if(S.mode==='win'){
    for(const c of confetti){
      ctx.fillStyle = c.color; ctx.fillRect(c.x, c.y, 6, 6);
    }
  }

  // HUD & Leaderboard
  ctx.fillStyle='#fff'; ctx.font='bold 16px sans-serif'; ctx.textAlign='left';
  ctx.fillText('💀 กำจัดไป: ' + S.kills + ' ตัว', 20, 35);
  ctx.fillText('🐟 ฝูงปลาของคุณ: ' + Math.floor(P.minions) + ' ตัว', 20, 60);

  drawLeaderboard();
}

/* ---------- ระบบควบคุมซีกซ้าย ---------- */
let joystickDir = { x: 0, y: 0 };
let touchId = null, touchStart = null;

addEventListener('touchstart', e => {
  initAudio();
  for(let i=0; i<e.changedTouches.length; i++){
    const t = e.changedTouches[i];
    if(t.clientX < W / 2 && touchId === null){
      touchId = t.identifier;
      touchStart = { x: t.clientX, y: t.clientY };
    }
  }
}, {passive: false});

addEventListener('touchmove', e => {
  for(let i=0; i<e.changedTouches.length; i++){
    const t = e.changedTouches[i];
    if(t.identifier === touchId){
      const dx = t.clientX - touchStart.x;
      const dy = t.clientY - touchStart.y;
      const dist = Math.hypot(dx, dy);
      if(dist > 5){
        joystickDir.x = dx / dist;
        joystickDir.y = dy / dist;
      }
    }
  }
}, {passive: false});

const endTouch = e => {
  for(let i=0; i<e.changedTouches.length; i++){
    if(e.changedTouches[i].identifier === touchId){
      touchId = null; joystickDir = { x: 0, y: 0 };
    }
  }
};
addEventListener('touchend', endTouch);
addEventListener('touchcancel', endTouch);

const keys = {};
addEventListener('keydown', e => { initAudio(); keys[e.code]=1; });
addEventListener('keyup', e => keys[e.code]=0);

let last = performance.now();
function loop(n){
  const dt = Math.min(.05, (n - last)/1000); last = n;
  if(touchId === null){
    joystickDir.x = (keys.ArrowRight||keys.KeyD?1:0) - (keys.ArrowLeft||keys.KeyA?1:0);
    joystickDir.y = (keys.ArrowDown||keys.KeyS?1:0) - (keys.ArrowUp||keys.KeyW?1:0);
  }
  update(dt); draw(); requestAnimationFrame(loop);
}

requestAnimationFrame(loop);
</script>
</body>
</html>
